<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#0d1117"/>
  <text x="400" y="26" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">Zyxel Firmware Analysis — Extraction &amp; Credential Recovery</text>

  <!-- Stage 1 -->
  <rect x="20" y="52" width="120" height="60" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="74" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Firmware</text>
  <text x="80" y="90" font-family="monospace" font-size="9" fill="#ffa657" text-anchor="middle">455ABUJOCO.bin</text>
  <text x="80" y="104" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Zyxel router</text>

  <line x1="140" y1="82" x2="165" y2="82" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="165,78 173,82 165,86" fill="#30363d"/>

  <!-- Stage 2: binwalk -->
  <rect x="173" y="52" width="130" height="60" rx="5" fill="#4ade8015" stroke="#4ade80" stroke-width="1.5"/>
  <text x="238" y="72" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">binwalk -eM</text>
  <text x="238" y="88" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">signature scan</text>
  <text x="238" y="103" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">recursive extract</text>

  <line x1="303" y1="82" x2="328" y2="82" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="328,78 336,82 328,86" fill="#30363d"/>

  <!-- Stage 3: squashfs -->
  <rect x="336" y="52" width="130" height="60" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="401" y="72" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">squashfs-root/</text>
  <text x="401" y="88" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Linux filesystem</text>
  <text x="401" y="103" font-family="monospace" font-size="9" fill="#ffa657" text-anchor="middle">shadow.basic found</text>

  <line x1="466" y1="82" x2="491" y2="82" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="491,78 499,82 491,86" fill="#30363d"/>

  <!-- Stage 4: pkcrack -->
  <rect x="499" y="52" width="140" height="60" rx="5" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="569" y="72" font-family="monospace" font-size="10" fill="#79c0ff" text-anchor="middle">pkcrack</text>
  <text x="569" y="88" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">known-plaintext</text>
  <text x="569" y="103" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">ZIP key recovery</text>

  <line x1="639" y1="82" x2="664" y2="82" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="664,78 672,82 664,86" fill="#30363d"/>

  <!-- Stage 5: hashcat -->
  <rect x="672" y="52" width="108" height="60" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="726" y="72" font-family="monospace" font-size="10" fill="#f85149" text-anchor="middle">hashcat</text>
  <text x="726" y="88" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">MD5crypt crack</text>
  <text x="726" y="103" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">creds recovered ✓</text>

  <!-- Detail section -->
  <line x1="20" y1="140" x2="780" y2="140" stroke="#30363d" stroke-width="1"/>

  <!-- binwalk output -->
  <rect x="20" y="155" width="370" height="160" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="205" y="173" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">binwalk output (selected)</text>
  <line x1="30" y1="179" x2="380" y2="179" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="197" font-family="monospace" font-size="10" fill="#8b949e">DECIMAL     DESCRIPTION</text>
  <text x="40" y="215" font-family="monospace" font-size="10" fill="#e6edf3">0           Zip archive</text>
  <text x="40" y="233" font-family="monospace" font-size="10" fill="#e6edf3">1,234,956   Squashfs filesystem</text>
  <text x="40" y="251" font-family="monospace" font-size="10" fill="#8b949e">            size: 4,984,832</text>
  <text x="40" y="269" font-family="monospace" font-size="10" fill="#8b949e">            compression: lzma</text>
  <text x="40" y="287" font-family="monospace" font-size="10" fill="#ffa657">            → shadow.basic extracted</text>
  <text x="40" y="305" font-family="monospace" font-size="10" fill="#8b949e">            → etc/, bin/, usr/</text>

  <!-- pkcrack + hashcat detail -->
  <rect x="410" y="155" width="370" height="160" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="595" y="173" font-family="monospace" font-size="11" fill="#79c0ff" text-anchor="middle">Known-plaintext attack (ZIP)</text>
  <line x1="420" y1="179" x2="770" y2="179" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="197" font-family="monospace" font-size="10" fill="#8b949e"># We know a file inside the ZIP in plaintext</text>
  <text x="430" y="215" font-family="monospace" font-size="10" fill="#4ade80">pkcrack -C encrypted.zip \</text>
  <text x="430" y="233" font-family="monospace" font-size="10" fill="#4ade80">  -c known_file.txt \</text>
  <text x="430" y="251" font-family="monospace" font-size="10" fill="#4ade80">  -p plaintext.txt</text>
  <text x="430" y="269" font-family="monospace" font-size="10" fill="#8b949e"># ZIP key recovered → decrypt shadow.basic</text>
  <text x="430" y="287" font-family="monospace" font-size="10" fill="#8b949e"># Hash: $1$... (MD5crypt)</text>
  <text x="430" y="305" font-family="monospace" font-size="10" fill="#f85149">hashcat -m 500 hash.txt wordlist.txt</text>
</svg>
