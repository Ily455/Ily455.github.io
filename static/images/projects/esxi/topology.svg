<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <rect width="800" height="440" fill="#0d1117"/>
  <text x="400" y="26" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">VMware ESXi 6.5 — Virtualized Enterprise Network</text>

  <!-- ESXi host container -->
  <rect x="20" y="40" width="760" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="62" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">VMware ESXi 6.5 Host — Dell i5-1135G7, 16GB RAM — managed via ESXi Host Client</text>

  <!-- Internet -->
  <rect x="310" y="70" width="180" height="34" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="92" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">Internet / External Network</text>

  <!-- Router VM -->
  <line x1="400" y1="104" x2="400" y2="130" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="396,130 400,138 404,130" fill="#4ade80"/>
  <rect x="280" y="138" width="240" height="44" rx="4" fill="#4ade8015" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="158" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">Routeur_US — Ubuntu Server 20</text>
  <text x="400" y="174" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">IP forwarding · NAT · default gateway · iptables</text>

  <!-- vSwitch -->
  <line x1="400" y1="182" x2="400" y2="208" stroke="#30363d" stroke-width="1.5"/>
  <rect x="150" y="208" width="500" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="227" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">vSwitch — Internal Virtual Network</text>

  <!-- Lines down from vSwitch -->
  <line x1="175" y1="236" x2="175" y2="262" stroke="#30363d" stroke-width="1"/>
  <line x1="295" y1="236" x2="295" y2="262" stroke="#30363d" stroke-width="1"/>
  <line x1="400" y1="236" x2="400" y2="262" stroke="#30363d" stroke-width="1"/>
  <line x1="520" y1="236" x2="520" y2="262" stroke="#30363d" stroke-width="1"/>
  <line x1="640" y1="236" x2="640" y2="262" stroke="#30363d" stroke-width="1"/>
  <line x1="175" y1="236" x2="640" y2="236" stroke="#30363d" stroke-width="1"/>

  <!-- VM boxes row 1 -->
  <rect x="36" y="262" width="156" height="54" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="114" y="282" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">DNS-WS</text>
  <text x="114" y="296" font-family="monospace" font-size="9" fill="#79c0ff" text-anchor="middle">Windows Server 2022</text>
  <text x="114" y="310" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">DNS resolution</text>

  <rect x="208" y="262" width="156" height="54" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="286" y="282" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">DHCP_US</text>
  <text x="286" y="296" font-family="monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Ubuntu Server 20</text>
  <text x="286" y="310" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">IP distribution</text>

  <rect x="322" y="262" width="156" height="54" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="282" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Web_US</text>
  <text x="400" y="296" font-family="monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Ubuntu Server 20</text>
  <text x="400" y="310" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">Apache HTTP</text>

  <rect x="436" y="262" width="156" height="54" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="514" y="282" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Supervision</text>
  <text x="514" y="296" font-family="monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Ubuntu</text>
  <text x="514" y="310" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">monitoring · SNMP</text>

  <rect x="608" y="262" width="156" height="54" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="686" y="282" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Poste Admin</text>
  <text x="686" y="296" font-family="monospace" font-size="9" fill="#e6edf3" text-anchor="middle">Ubuntu Desktop 22</text>
  <text x="686" y="310" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">admin workstation</text>

  <!-- Masters section -->
  <line x1="40" y1="336" x2="760" y2="336" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="354" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Master VMs (golden images — clone to deploy)</text>

  <rect x="120" y="362" width="200" height="34" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="220" y="384" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Ubuntu Master — base for all Linux VMs</text>

  <rect x="480" y="362" width="200" height="34" rx="4" fill="#21262d" stroke="#79c0ff" stroke-width="1"/>
  <text x="580" y="384" font-family="monospace" font-size="10" fill="#79c0ff" text-anchor="middle">Windows Server Master — Win base</text>
</svg>
