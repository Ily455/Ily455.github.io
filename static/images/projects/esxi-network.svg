<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- Window chrome -->
  <rect x="40" y="40" width="720" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="40" width="720" height="36" rx="8" fill="#21262d"/>
  <rect x="40" y="64" width="720" height="12" fill="#21262d"/>
  <circle cx="68" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="58" r="6" fill="#28ca41"/>
  <text x="400" y="62" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">VMware ESXi 6.5 — Enterprise Network Lab</text>

  <!-- Internet -->
  <rect x="320" y="84" width="160" height="32" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="105" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">Internet / External</text>
  <line x1="400" y1="116" x2="400" y2="140" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Router VM -->
  <rect x="300" y="140" width="200" height="36" rx="4" fill="#4ade8018" stroke="#4ade80" stroke-width="1"/>
  <text x="400" y="158" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Ubuntu Router VM</text>
  <text x="400" y="172" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">iptables · NAT · routing</text>

  <!-- vSwitch connector -->
  <line x1="400" y1="176" x2="400" y2="198" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <rect x="290" y="198" width="220" height="24" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="215" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">vSwitch — internal network</text>

  <!-- Lines down from vSwitch -->
  <line x1="200" y1="222" x2="200" y2="252" stroke="#30363d" stroke-width="1"/>
  <line x1="340" y1="222" x2="340" y2="252" stroke="#30363d" stroke-width="1"/>
  <line x1="460" y1="222" x2="460" y2="252" stroke="#30363d" stroke-width="1"/>
  <line x1="600" y1="222" x2="600" y2="252" stroke="#30363d" stroke-width="1"/>

  <!-- Horizontal connector -->
  <line x1="200" y1="222" x2="600" y2="222" stroke="#30363d" stroke-width="1"/>

  <!-- DNS/DHCP -->
  <rect x="100" y="252" width="200" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="200" y="270" font-family="monospace" font-size="12" fill="#e6edf3" text-anchor="middle">Windows Server 2022</text>
  <text x="200" y="285" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">DNS · DHCP</text>

  <!-- Admin -->
  <rect x="255" y="252" width="160" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="270" font-family="monospace" font-size="12" fill="#e6edf3" text-anchor="middle">Admin Post</text>
  <text x="335" y="285" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">management</text>

  <!-- Apache -->
  <rect x="385" y="252" width="160" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="465" y="270" font-family="monospace" font-size="12" fill="#e6edf3" text-anchor="middle">Apache HTTP</text>
  <text x="465" y="285" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Ubuntu Server</text>

  <!-- Supervision -->
  <rect x="500" y="252" width="200" height="40" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="270" font-family="monospace" font-size="12" fill="#e6edf3" text-anchor="middle">Supervision Post</text>
  <text x="600" y="285" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">monitoring · Nagios</text>

  <!-- Footer info -->
  <line x1="68" y1="316" x2="732" y2="316" stroke="#30363d" stroke-width="1"/>
  <text x="68" y="340" font-family="monospace" font-size="12" fill="#8b949e">Platform:  VMware ESXi 6.5  ·  6 VMs deployed from master templates</text>
  <text x="68" y="362" font-family="monospace" font-size="12" fill="#8b949e">Services:  DNS (Win 2022)  ·  DHCP  ·  HTTP  ·  NAT routing  ·  SNMP supervision</text>
  <text x="68" y="384" font-family="monospace" font-size="12" fill="#4ade80">All VMs cloned from master templates  ·  VLAN-isolated internal network</text>
</svg>
