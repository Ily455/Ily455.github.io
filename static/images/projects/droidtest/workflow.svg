<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="32" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">DroidTest — Execution Flow</text>

  <!-- list.txt -->
  <rect x="30" y="60" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="84" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">list.txt</text>
  <text x="90" y="100" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">adb commands</text>
  <text x="90" y="114" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">one per line</text>

  <!-- Arrow -->
  <line x1="150" y1="90" x2="185" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="185,86 193,90 185,94" fill="#30363d"/>

  <!-- CLI / core.py -->
  <rect x="193" y="60" width="140" height="60" rx="6" fill="#21262d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="263" y="84" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">core.py</text>
  <text x="263" y="100" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">load + dispatch</text>
  <text x="263" y="114" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">timeout / filter</text>

  <!-- Arrow -->
  <line x1="333" y1="90" x2="368" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="368,86 376,90 368,94" fill="#30363d"/>

  <!-- ADB -->
  <rect x="376" y="60" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="436" y="84" font-family="monospace" font-size="11" fill="#e6edf3" text-anchor="middle">adb shell</text>
  <text x="436" y="100" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">subprocess</text>
  <text x="436" y="114" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">USB / TCP</text>

  <!-- Arrow -->
  <line x1="496" y1="90" x2="531" y2="90" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="531,86 539,90 531,94" fill="#30363d"/>

  <!-- Device -->
  <rect x="539" y="60" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="599" y="84" font-family="monospace" font-size="11" fill="#79c0ff" text-anchor="middle">Android device</text>
  <text x="599" y="100" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">emulator / physical</text>
  <text x="599" y="114" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">ADB daemon</text>

  <!-- Return arrow (curved, below) -->
  <path d="M 599 120 Q 599 160 436 160 Q 263 160 263 120" stroke="#30363d" stroke-width="1" fill="none" stroke-dasharray="5,3"/>
  <polygon points="259,120 263,112 267,120" fill="#30363d"/>
  <text x="430" y="178" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">stdout / stderr / returncode</text>

  <!-- Results box -->
  <rect x="193" y="200" width="140" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="263" y="222" font-family="monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Result collector</text>
  <text x="263" y="238" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">PASS / FAIL per cmd</text>
  <text x="263" y="254" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">duration, output</text>
  <text x="263" y="268" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">error message</text>

  <!-- Arrow down from core to results -->
  <line x1="263" y1="120" x2="263" y2="198" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrows from Results -->
  <!-- To terminal output -->
  <line x1="193" y1="235" x2="158" y2="235" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="158,231 150,235 158,239" fill="#30363d"/>
  <rect x="30" y="205" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="228" font-family="monospace" font-size="11" fill="#e6edf3" text-anchor="middle">Terminal</text>
  <text x="90" y="244" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">PASS / FAIL</text>
  <text x="90" y="258" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">verbose output</text>

  <!-- To JSON report -->
  <line x1="333" y1="235" x2="368" y2="235" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="368,231 376,235 368,239" fill="#30363d"/>
  <rect x="376" y="205" width="120" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="436" y="228" font-family="monospace" font-size="11" fill="#ffa657" text-anchor="middle">report.json</text>
  <text x="436" y="244" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">structured results</text>
  <text x="436" y="258" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">--json flag</text>

  <!-- CLI args box -->
  <rect x="539" y="205" width="230" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="654" y="226" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">CLI flags</text>
  <text x="654" y="244" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">-v  --timeout N  --json file</text>
  <text x="654" y="260" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">-s SERIAL  --filter pattern</text>
  <text x="654" y="276" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">--list path/to/commands.txt</text>

  <!-- Summary bar -->
  <rect x="30" y="300" width="740" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="322" font-family="monospace" font-size="11" fill="#4ade80">PASS: 31</text>
  <text x="90" y="340" font-family="monospace" font-size="10" fill="#8b949e">commands that returned exit 0</text>
  <text x="290" y="322" font-family="monospace" font-size="11" fill="#f85149">FAIL: 3</text>
  <text x="290" y="340" font-family="monospace" font-size="10" fill="#8b949e">non-zero exit or timeout</text>
  <text x="490" y="322" font-family="monospace" font-size="11" fill="#e6edf3">TOTAL: 34</text>
  <text x="490" y="340" font-family="monospace" font-size="10" fill="#8b949e">commands from list.txt</text>
</svg>
