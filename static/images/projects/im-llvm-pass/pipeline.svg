<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#0d1117"/>
  <text x="400" y="28" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">LLVM Compilation Pipeline — IM-LLVM-Pass Position</text>

  <!-- Pipeline boxes -->
  <!-- Source -->
  <rect x="20" y="55" width="90" height="52" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="65" y="76" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Source</text>
  <text x="65" y="92" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">target.c</text>
  <text x="65" y="106" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">C / C++</text>

  <line x1="110" y1="81" x2="132" y2="81" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="132,77 140,81 132,85" fill="#30363d"/>

  <!-- Clang frontend -->
  <rect x="140" y="55" width="100" height="52" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="190" y="76" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Clang</text>
  <text x="190" y="92" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">frontend</text>
  <text x="190" y="106" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">parse + type check</text>

  <line x1="240" y1="81" x2="262" y2="81" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="262,77 270,81 262,85" fill="#30363d"/>

  <!-- LLVM IR (before) -->
  <rect x="270" y="55" width="110" height="52" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="325" y="76" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">LLVM IR</text>
  <text x="325" y="92" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">@addNumbers</text>
  <text x="325" y="106" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">@checkLicense</text>

  <line x1="380" y1="81" x2="402" y2="81" stroke="#4ade80" stroke-width="2"/>
  <polygon points="402,77 410,81 402,85" fill="#4ade80"/>

  <!-- IM-LLVM-Pass (highlighted) -->
  <rect x="410" y="44" width="130" height="74" rx="5" fill="#4ade8015" stroke="#4ade80" stroke-width="2"/>
  <text x="475" y="68" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="bold">IM-LLVM-Pass</text>
  <text x="475" y="84" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">ModulePass</text>
  <text x="475" y="98" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">rename internal</text>
  <text x="475" y="112" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">symbols (mt19937)</text>

  <line x1="540" y1="81" x2="562" y2="81" stroke="#4ade80" stroke-width="2"/>
  <polygon points="562,77 570,81 562,85" fill="#4ade80"/>

  <!-- Mangled IR -->
  <rect x="570" y="55" width="110" height="52" rx="5" fill="#161b22" stroke="#4ade80" stroke-width="1"/>
  <text x="625" y="76" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Mangled IR</text>
  <text x="625" y="92" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">@_Zf3a9b1c</text>
  <text x="625" y="106" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">@_Z8d2e4f1a</text>

  <line x1="680" y1="81" x2="702" y2="81" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="702,77 710,81 702,85" fill="#30363d"/>

  <!-- Backend -->
  <rect x="710" y="55" width="70" height="52" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="745" y="76" font-family="monospace" font-size="10" fill="#e6edf3" text-anchor="middle">Backend</text>
  <text x="745" y="92" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">.o → binary</text>
  <text x="745" y="106" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">x86/ARM/RV</text>

  <!-- Separator -->
  <line x1="20" y1="150" x2="780" y2="150" stroke="#30363d" stroke-width="1"/>

  <!-- Before / After symbol tables -->
  <text x="400" y="172" font-family="monospace" font-size="12" fill="#e6edf3" text-anchor="middle">Symbol table — before vs after  (nm output)</text>

  <!-- Before -->
  <rect x="20" y="185" width="360" height="130" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="200" y="204" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle">BEFORE — nm target</text>
  <line x1="30" y1="210" x2="370" y2="210" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="228" font-family="monospace" font-size="12" fill="#e6edf3">0000  T  main</text>
  <text x="40" y="248" font-family="monospace" font-size="12" fill="#f85149">0000  T  checkLicenseKey</text>
  <text x="40" y="268" font-family="monospace" font-size="12" fill="#f85149">0000  T  decrypt_payload</text>
  <text x="40" y="288" font-family="monospace" font-size="12" fill="#f85149">0000  T  computeChecksum</text>
  <text x="40" y="308" font-family="monospace" font-size="12" fill="#f85149">0000  T  verifySignature</text>

  <!-- After -->
  <rect x="420" y="185" width="360" height="130" rx="5" fill="#161b22" stroke="#4ade80" stroke-width="1"/>
  <text x="600" y="204" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">AFTER — nm target_mangled</text>
  <line x1="430" y1="210" x2="770" y2="210" stroke="#30363d" stroke-width="1"/>
  <text x="440" y="228" font-family="monospace" font-size="12" fill="#e6edf3">0000  T  main</text>
  <text x="440" y="248" font-family="monospace" font-size="12" fill="#4ade80">0000  T  _Zf3a9b1c</text>
  <text x="440" y="268" font-family="monospace" font-size="12" fill="#4ade80">0000  T  _Z8d2e4f1a</text>
  <text x="440" y="288" font-family="monospace" font-size="12" fill="#4ade80">0000  T  _Z1b7c9d3e</text>
  <text x="440" y="308" font-family="monospace" font-size="12" fill="#4ade80">0000  T  _Z5f9a2b8d</text>
</svg>
