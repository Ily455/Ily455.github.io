<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#0d1117"/>
  <text x="400" y="28" font-family="monospace" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="bold">Obfuscator Benchmark — Overhead vs Protection  (aes.c, RISC-V target)</text>

  <!-- Y axis label -->
  <text x="18" y="200" font-family="monospace" font-size="10" fill="#8b949e" transform="rotate(-90 18 200)">CFG Similarity (lower = more obfuscated)</text>
  <!-- X axis label -->
  <text x="400" y="370" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">Binary Size Overhead (ratio vs original)</text>

  <!-- Grid area -->
  <rect x="80" y="50" width="680" height="290" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>

  <!-- Grid lines horizontal -->
  <line x1="80" y1="123" x2="760" y2="123" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="195" x2="760" y2="195" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="267" x2="760" y2="267" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Grid lines vertical -->
  <line x1="250" y1="50" x2="250" y2="340" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="420" y1="50" x2="420" y2="340" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="590" y1="50" x2="590" y2="340" stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Axis labels Y -->
  <text x="72" y="54" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">100%</text>
  <text x="72" y="127" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">75%</text>
  <text x="72" y="199" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">50%</text>
  <text x="72" y="271" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">25%</text>
  <text x="72" y="343" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">0%</text>

  <!-- Axis labels X -->
  <text x="80" y="358" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">1×</text>
  <text x="250" y="358" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">2×</text>
  <text x="420" y="358" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">3×</text>
  <text x="590" y="358" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">4×</text>
  <text x="760" y="358" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">5×</text>

  <!-- Ideal zone (low overhead, low similarity) -->
  <rect x="80" y="195" width="340" height="145" fill="#4ade8008" rx="2"/>
  <text x="260" y="330" font-family="monospace" font-size="9" fill="#4ade8060" text-anchor="middle">ideal zone</text>

  <!-- Data points -->
  <!-- O-LLVM BCF: size 1.88×, similarity 55.4% → x=240, y=195-(55.4/100*290)=195-160=35 → y=195-160=35...
       Let me recalculate. Y axis: 100% at y=50, 0% at y=340. So y = 340 - (sim/100 * 290)
       X axis: 1× at x=80, 5× at x=760. So x = 80 + ((ratio-1)/4 * 680)

       O-LLVM BCF: ratio=1.88, sim=55.4 → x=80+(0.88/4*680)=80+149=229, y=340-(0.554*290)=340-161=179
       Hikari BCF: ratio=2.46, sim=77.9 → x=80+(1.46/4*680)=80+248=328, y=340-(0.779*290)=340-226=114
       Hikari IB:  ratio=1.3, sim=49.2 → x=80+(0.3/4*680)=80+51=131, y=340-(0.492*290)=340-143=197
       Pluto BCF: ratio=3.5, sim=31.4 → x=80+(2.5/4*680)=80+425=505, y=340-(0.314*290)=340-91=249
       Tigress BCF: ratio=3.75, sim=34.3 → x=80+(2.75/4*680)=80+468=548, y=340-(0.343*290)=340-99=241
       Tigress VRTLZ: ratio=61x — off chart, so cap at 5x for display? No, let's just put it at the edge
       Hikari SUB: ratio ~1.1, sim ~47 → x=80+(0.1/4*680)=97, y=340-(0.47*290)=340-136=204
  -->

  <!-- O-LLVM BCF -->
  <circle cx="229" cy="179" r="8" fill="#f85149" opacity="0.8"/>
  <text x="237" y="172" font-family="monospace" font-size="9" fill="#f85149">O-LLVM BCF</text>
  <text x="237" y="183" font-family="monospace" font-size="9" fill="#8b949e">1.88× · 55%</text>

  <!-- Hikari IB (near ideal) -->
  <circle cx="131" cy="197" r="9" fill="#4ade80" opacity="0.9" stroke="#4ade80" stroke-width="2"/>
  <text x="139" y="190" font-family="monospace" font-size="9" fill="#4ade80">Hikari IB</text>
  <text x="139" y="201" font-family="monospace" font-size="9" fill="#8b949e">1.3× · 49%</text>

  <!-- Hikari BCF -->
  <circle cx="328" cy="114" r="9" fill="#4ade80" opacity="0.7"/>
  <text x="336" y="107" font-family="monospace" font-size="9" fill="#4ade80">Hikari BCF</text>
  <text x="336" y="118" font-family="monospace" font-size="9" fill="#8b949e">2.46× · 78%</text>

  <!-- Hikari SE (selected for integration) -->
  <circle cx="174" cy="232" r="11" fill="#4ade80" stroke="#e6edf3" stroke-width="2"/>
  <text x="188" y="222" font-family="monospace" font-size="9" fill="#4ade80" font-weight="bold">Hikari SE ← selected</text>
  <text x="188" y="235" font-family="monospace" font-size="9" fill="#8b949e">1.6× · 40%</text>

  <!-- Pluto BCF -->
  <circle cx="505" cy="249" r="8" fill="#ffa657" opacity="0.8"/>
  <text x="513" y="242" font-family="monospace" font-size="9" fill="#ffa657">Pluto BCF</text>
  <text x="513" y="253" font-family="monospace" font-size="9" fill="#8b949e">3.5× · 31%</text>

  <!-- Tigress BCF -->
  <circle cx="548" cy="241" r="8" fill="#ffa657" opacity="0.7"/>
  <text x="440" y="258" font-family="monospace" font-size="9" fill="#ffa657">Tigress BCF</text>
  <text x="440" y="268" font-family="monospace" font-size="9" fill="#8b949e">3.75× · 34%</text>

  <!-- Tigress VRTLZ (way off chart) -->
  <text x="748" y="100" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">Tigress VRTLZ</text>
  <text x="748" y="112" font-family="monospace" font-size="9" fill="#f85149" text-anchor="end">61× → off chart</text>
  <line x1="730" y1="95" x2="762" y2="95" stroke="#f85149" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <rect x="86" y="56" width="180" height="60" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="102" cy="73" r="6" fill="#4ade80"/>
  <text x="115" y="77" font-family="monospace" font-size="9" fill="#4ade80">Hikari (selected)</text>
  <circle cx="102" cy="91" r="6" fill="#ffa657"/>
  <text x="115" y="95" font-family="monospace" font-size="9" fill="#ffa657">Pluto / Tigress</text>
  <circle cx="102" cy="109" r="6" fill="#f85149"/>
  <text x="115" y="113" font-family="monospace" font-size="9" fill="#f85149">O-LLVM</text>
</svg>
