<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- Window chrome -->
  <rect x="40" y="40" width="720" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="40" width="720" height="36" rx="8" fill="#21262d"/>
  <rect x="40" y="64" width="720" height="12" fill="#21262d"/>
  <circle cx="68" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="58" r="6" fill="#28ca41"/>
  <text x="400" y="62" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">py-c-obfuscator — source-to-source transformation</text>

  <!-- Command -->
  <text x="68" y="106" font-family="monospace" font-size="13" fill="#4ade80">$ </text>
  <text x="84" y="106" font-family="monospace" font-size="13" fill="#e6edf3">python3 obfuscate.py --input foo.c --out foo_obf.c</text>

  <!-- Separator -->
  <line x1="68" y1="122" x2="732" y2="122" stroke="#30363d" stroke-width="1"/>

  <!-- Column labels -->
  <text x="178" y="144" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">ORIGINAL  (foo.c)</text>
  <text x="565" y="144" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">OBFUSCATED  (foo_obf.c)</text>
  <line x1="400" y1="122" x2="400" y2="390" stroke="#30363d" stroke-width="1"/>

  <!-- Before code -->
  <text x="68" y="170" font-family="monospace" font-size="12" fill="#8b949e">// C source</text>
  <text x="68" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="100" y="190" font-family="monospace" font-size="13" fill="#d2a8ff">add</text>
  <text x="124" y="190" font-family="monospace" font-size="13" fill="#e6edf3">(</text>
  <text x="132" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="164" y="190" font-family="monospace" font-size="13" fill="#e6edf3">a, </text>
  <text x="188" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="220" y="190" font-family="monospace" font-size="13" fill="#e6edf3">b) {</text>

  <text x="68" y="210" font-family="monospace" font-size="13" fill="#e6edf3">  </text>
  <text x="80" y="210" font-family="monospace" font-size="13" fill="#ff7b72">return </text>
  <text x="136" y="210" font-family="monospace" font-size="13" fill="#e6edf3">a + b;</text>
  <text x="68" y="230" font-family="monospace" font-size="13" fill="#e6edf3">}</text>

  <text x="68" y="258" font-family="monospace" font-size="13" fill="#ff7b72">void </text>
  <text x="108" y="258" font-family="monospace" font-size="13" fill="#d2a8ff">swap</text>
  <text x="136" y="258" font-family="monospace" font-size="13" fill="#e6edf3">(</text>
  <text x="144" y="258" font-family="monospace" font-size="13" fill="#ff7b72">int</text>
  <text x="172" y="258" font-family="monospace" font-size="13" fill="#e6edf3"> *x, </text>
  <text x="212" y="258" font-family="monospace" font-size="13" fill="#ff7b72">int</text>
  <text x="240" y="258" font-family="monospace" font-size="13" fill="#e6edf3"> *y) {</text>
  <text x="68" y="278" font-family="monospace" font-size="13" fill="#e6edf3">  </text>
  <text x="80" y="278" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="112" y="278" font-family="monospace" font-size="13" fill="#e6edf3">t=*x; *x=*y; *y=t;</text>
  <text x="68" y="298" font-family="monospace" font-size="13" fill="#e6edf3">}</text>

  <!-- After code -->
  <text x="420" y="170" font-family="monospace" font-size="12" fill="#8b949e">// Obfuscated AST output</text>
  <text x="420" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="452" y="190" font-family="monospace" font-size="13" fill="#4ade80">_x7f2a</text>
  <text x="504" y="190" font-family="monospace" font-size="13" fill="#e6edf3">(</text>
  <text x="512" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="544" y="190" font-family="monospace" font-size="13" fill="#4ade80">_k9</text>
  <text x="572" y="190" font-family="monospace" font-size="13" fill="#e6edf3">,</text>
  <text x="580" y="190" font-family="monospace" font-size="13" fill="#ff7b72">int </text>
  <text x="612" y="190" font-family="monospace" font-size="13" fill="#4ade80">_m3</text>
  <text x="640" y="190" font-family="monospace" font-size="13" fill="#e6edf3">) {</text>

  <text x="420" y="210" font-family="monospace" font-size="13" fill="#e6edf3">  </text>
  <text x="432" y="210" font-family="monospace" font-size="13" fill="#ff7b72">return</text>
  <text x="492" y="210" font-family="monospace" font-size="13" fill="#4ade80"> (_k9^_m3)+((_k9&amp;_m3)&lt;&lt;1);</text>
  <text x="420" y="230" font-family="monospace" font-size="13" fill="#e6edf3">}</text>

  <text x="420" y="258" font-family="monospace" font-size="13" fill="#ff7b72">void </text>
  <text x="460" y="258" font-family="monospace" font-size="13" fill="#4ade80">_q1r8</text>
  <text x="500" y="258" font-family="monospace" font-size="13" fill="#e6edf3">(</text>
  <text x="508" y="258" font-family="monospace" font-size="13" fill="#ff7b72">int</text>
  <text x="536" y="258" font-family="monospace" font-size="13" fill="#4ade80"> *_p2,</text>
  <text x="586" y="258" font-family="monospace" font-size="13" fill="#ff7b72">int</text>
  <text x="614" y="258" font-family="monospace" font-size="13" fill="#4ade80"> *_n5</text>
  <text x="650" y="258" font-family="monospace" font-size="13" fill="#e6edf3">) {</text>
  <text x="420" y="278" font-family="monospace" font-size="13" fill="#ff7b72">  int </text>
  <text x="466" y="278" font-family="monospace" font-size="13" fill="#4ade80">_t0</text>
  <text x="492" y="278" font-family="monospace" font-size="13" fill="#e6edf3">=*_p2;*_p2=*_n5;*_n5=_t0;</text>
  <text x="420" y="298" font-family="monospace" font-size="13" fill="#e6edf3">}</text>

  <!-- Footer -->
  <line x1="68" y1="318" x2="732" y2="318" stroke="#30363d" stroke-width="1"/>
  <text x="68" y="342" font-family="monospace" font-size="12" fill="#8b949e">Transforms:  identifier renaming  ·  expression rewriting  ·  opaque predicates</text>
  <text x="68" y="364" font-family="monospace" font-size="12" fill="#8b949e">Output:  valid C source  ·  compiles cleanly  ·  functionally equivalent</text>
</svg>
