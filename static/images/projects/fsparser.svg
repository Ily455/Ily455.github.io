<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- Window chrome -->
  <rect x="40" y="40" width="720" height="370" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="40" width="720" height="36" rx="8" fill="#21262d"/>
  <rect x="40" y="64" width="720" height="12" fill="#21262d"/>
  <circle cx="68" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="58" r="6" fill="#28ca41"/>
  <text x="400" y="62" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">fsparser — FAT32 &amp; EXT filesystem analysis</text>

  <!-- Command -->
  <text x="68" y="106" font-family="monospace" font-size="13" fill="#4ade80">$ </text>
  <text x="84" y="106" font-family="monospace" font-size="13" fill="#e6edf3">python3 fsparser.py --image disk.img --fs fat32</text>

  <!-- Detection -->
  <text x="68" y="128" font-family="monospace" font-size="12" fill="#4ade80">[+] FAT32 signature detected at offset 0x0000</text>

  <!-- Table header -->
  <rect x="68" y="140" width="664" height="24" fill="#21262d" rx="2"/>
  <text x="80" y="157" font-family="monospace" font-size="11" fill="#4ade80">Offset</text>
  <text x="175" y="157" font-family="monospace" font-size="11" fill="#4ade80">Hex</text>
  <text x="430" y="157" font-family="monospace" font-size="11" fill="#4ade80">Field</text>
  <text x="570" y="157" font-family="monospace" font-size="11" fill="#4ade80">Value</text>

  <!-- Rows -->
  <text x="80" y="178" font-family="monospace" font-size="12" fill="#8b949e">0x0000</text>
  <text x="175" y="178" font-family="monospace" font-size="12" fill="#ffa657">EB 58 90</text>
  <text x="430" y="178" font-family="monospace" font-size="12" fill="#e6edf3">JMP + NOP</text>
  <text x="570" y="178" font-family="monospace" font-size="12" fill="#8b949e">boot code</text>

  <text x="80" y="198" font-family="monospace" font-size="12" fill="#8b949e">0x0003</text>
  <text x="175" y="198" font-family="monospace" font-size="12" fill="#ffa657">4D 53 44 4F 53 20 20 20</text>
  <text x="430" y="198" font-family="monospace" font-size="12" fill="#e6edf3">OEM Name</text>
  <text x="570" y="198" font-family="monospace" font-size="12" fill="#e6edf3">"MSDOS   "</text>

  <text x="80" y="218" font-family="monospace" font-size="12" fill="#8b949e">0x000B</text>
  <text x="175" y="218" font-family="monospace" font-size="12" fill="#ffa657">00 02</text>
  <text x="430" y="218" font-family="monospace" font-size="12" fill="#e6edf3">Bytes/Sector</text>
  <text x="570" y="218" font-family="monospace" font-size="12" fill="#4ade80">512</text>

  <text x="80" y="238" font-family="monospace" font-size="12" fill="#8b949e">0x000D</text>
  <text x="175" y="238" font-family="monospace" font-size="12" fill="#ffa657">08</text>
  <text x="430" y="238" font-family="monospace" font-size="12" fill="#e6edf3">Sectors/Cluster</text>
  <text x="570" y="238" font-family="monospace" font-size="12" fill="#4ade80">8</text>

  <text x="80" y="258" font-family="monospace" font-size="12" fill="#8b949e">0x000E</text>
  <text x="175" y="258" font-family="monospace" font-size="12" fill="#ffa657">20 00</text>
  <text x="430" y="258" font-family="monospace" font-size="12" fill="#e6edf3">Reserved Sectors</text>
  <text x="570" y="258" font-family="monospace" font-size="12" fill="#4ade80">32</text>

  <text x="80" y="278" font-family="monospace" font-size="12" fill="#8b949e">0x0010</text>
  <text x="175" y="278" font-family="monospace" font-size="12" fill="#ffa657">02</text>
  <text x="430" y="278" font-family="monospace" font-size="12" fill="#e6edf3">Number of FATs</text>
  <text x="570" y="278" font-family="monospace" font-size="12" fill="#4ade80">2</text>

  <!-- Separator -->
  <line x1="68" y1="296" x2="732" y2="296" stroke="#30363d" stroke-width="1"/>

  <!-- Summary -->
  <text x="68" y="320" font-family="monospace" font-size="12" fill="#8b949e">Volume:   </text>
  <text x="152" y="320" font-family="monospace" font-size="12" fill="#e6edf3">15,728,640 sectors  ·  Root cluster: 2  ·  FAT offset: 0x4000</text>

  <text x="68" y="342" font-family="monospace" font-size="12" fill="#8b949e">Extracted:</text>
  <text x="152" y="342" font-family="monospace" font-size="12" fill="#4ade80">847 files  ·  63 directories  ·  12 deleted entries recovered</text>

  <text x="68" y="370" font-family="monospace" font-size="12" fill="#8b949e">Supports:  FAT32  ·  EXT2/3/4  ·  raw disk images  ·  no OS mount required</text>
</svg>
