baseURL = "https://ily455.github.io/"
languageCode = "en-us"
title = "Ilyass El Annid"
theme = "hugo-noir"
enableRobotsTXT = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
 
[languages]
  [languages.en]
    languageName = "English"
    title = "Ilyass El Annid"
    weight = 1
    contentDir = "content/en"
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.en.menu.main]]
        name = "Projects"
        pageRef = "/projects"
        weight = 2
      [[languages.en.menu.main]]
        name = "Write-ups"
        pageRef = "/writeups"
        weight = 3


  [languages.fr]
    languageName = "Français"
    title = "Ilyass El Annid"
    weight = 2
    contentDir = "content/fr"
    [languages.fr.menu]
      [[languages.fr.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.fr.menu.main]]
        name = "Projets"
        pageRef = "/projects"
        weight = 2
      [[languages.fr.menu.main]]
        name = "Notes"
        pageRef = "/writeups"
        weight = 3

[params]
  name = "Ilyass El Annid"
  location = "France"
  description = "Ilyass El Annid — cybersecurity engineer specializing in software protection, digital forensics, and blue team deployment."
  github = "https://github.com/Ily455"
  linkedin = "https://linkedin.com/in/ilyass-elannid"
  email = "ilyass.elannid@gmail.com"

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
